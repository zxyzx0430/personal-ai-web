<div class="sec-head"><div class="sec-num mono">01 / WHY</div><div><h2>同样的学习困难，<br/><span class="blue">原因可能不同。</span></h2><p>先选出最像孩子真实情况的一项。点开卡片，看看问题可能出在哪个环节、怎样验证，再按需观看相应的视频讲解。</p></div></div>
<div class="problem-grid">
<article class="problem" data-insight="1"><b class="mono">01</b><h3>听懂了，却做不出来</h3><p>先区分具体的知识障碍，再提供不同的讲解。</p></article>
<article class="problem" data-insight="2"><b class="mono">02</b><h3>记住公式，却缺少直觉</h3><p>通过预测、观察和解释，把抽象关系变成可以验证的过程。</p></article>
<article class="problem" data-insight="3"><b class="mono">03</b><h3>订正过的错题，又犯错</h3><p>保留错误原因、掌握证据与后续复习线索。</p></article>
<article class="problem" data-insight="4"><b class="mono">04</b><h3>出现疑问，反馈却要等</h3><p>在思路尚清晰时获得提示，减少反复恢复思考的成本。</p></article>
