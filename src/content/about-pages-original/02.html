<div class="sec-head"><div class="sec-num mono">01 / WHY</div><div><h2>为什么需要一种<br/><span style="color:var(--blue)">更贴近个人</span>的学习方式？</h2><p>同样的学习问题，背后可能有不同原因。先通过真实行为区分知识卡点、学习方法和生活习惯；也看见孩子已经做得好的部分，不预设每个孩子都需要额外课程。</p></div></div>
<div class="problem-grid">
<article class="problem"><b class="mono">01</b><h3>听懂了，却做不出来</h3><p>先区分具体的知识障碍，再提供不同的讲解。</p></article>
<article class="problem"><b class="mono">02</b><h3>记住公式，却缺少直觉</h3><p>通过预测、观察和解释，把抽象关系变成可以验证的过程。</p></article>
<article class="problem"><b class="mono">03</b><h3>订正过的错题，又犯错</h3><p>保留错误原因、掌握证据与后续复习线索。</p></article>
<article class="problem"><b class="mono">04</b><h3>出现疑问，反馈却要等</h3><p>在思路尚清晰时获得提示，减少反复恢复思考的成本。</p></article>
