<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf8">
<meta name="description" content="Personal AI System · 项目介绍 / 在学中扩展 / 在做中扩展。了解免费教育研究、学生学习系统与成人版演示。">
<title>Personal AI System｜在学中扩展 · 在做中扩展</title>
<style>
:root{--paper:#fafaf8;--ink:#0a0a0a;--blue:#002fa7;--gray:#707070;--line:#dededb;--sans:Inter,"Helvetica Neue",Arial,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button,a{font:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
#presentation{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:block;border:0;background:var(--paper)}
/* A single folded tab: no permanent top navigation or large chooser page. */
.side-tab{position:fixed;z-index:20;left:0;top:48%;transform:translateY(-50%);width:38px;min-height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:12px 0;border:1px solid #d7d7d4;border-left:0;border-radius:0 5px 5px 0;background:rgba(250,250,248,.97);color:var(--blue);box-shadow:0 3px 16px rgba(0,0,0,.075);transition:width .2s ease,background .2s ease}
.side-tab:hover{width:44px;background:#fff}

/* After a version has been selected the launcher retracts completely.
   The transparent left-edge hit area remains touchable; hovering/focusing
   brings the control back temporarily. */
.side-tab.is-tucked{opacity:0;transform:translate(-15px,-50%);box-shadow:none;border-color:transparent;transition:opacity .18s ease,transform .18s ease}
.side-tab.is-tucked:hover,.side-tab.is-tucked:focus-visible{opacity:1;transform:translate(0,-50%);box-shadow:0 3px 16px rgba(0,0,0,.075);border-color:#d7d7d4}
@media(hover:none){.side-tab.is-tucked:hover:not(:focus-visible){opacity:0;transform:translate(-15px,-50%)}}
.side-tab .symbol{display:grid;grid-template-columns:repeat(2,4px);gap:4px}
.side-tab .symbol i{width:4px;height:4px;background:currentColor}
.side-tab .vertical{font:600 11px/1.1 var(--sans);letter-spacing:.15em;writing-mode:vertical-rl}
.side-tab .tiny{font:500 9px/1 var(--mono);color:#848484;letter-spacing:0}
#switchDrawer{position:fixed;inset:0 auto 0 0;margin:0;padding:0;border:0;border-right:1px solid #ddd;max-width:none;max-height:none;height:100%;height:100dvh;width:min(355px,calc(100vw - 46px));background:var(--paper);color:var(--ink);box-shadow:18px 0 65px rgba(10,10,10,.13);overflow-y:auto;overscroll-behavior:contain}
#switchDrawer[open]{animation:drawer-in .23s cubic-bezier(.2,.75,.3,1) both}
#switchDrawer.closing{animation:drawer-out .19s cubic-bezier(.55,0,.8,.3) both}
#switchDrawer::backdrop{background:rgba(10,10,10,.27);animation:shade-in .23s ease both}
#switchDrawer.closing::backdrop{animation:shade-out .19s ease both}
@keyframes drawer-in{from{transform:translateX(-105%)}to{transform:translateX(0)}}
@keyframes drawer-out{from{transform:translateX(0)}to{transform:translateX(-105%)}}
@keyframes shade-in{from{background:rgba(10,10,10,0)}to{background:rgba(10,10,10,.27)}}
@keyframes shade-out{from{background:rgba(10,10,10,.27)}to{background:rgba(10,10,10,0)}}
.drawer-inner{padding:34px 29px 32px;display:flex;flex-direction:column;min-height:100%}
.drawer-header{display:flex;align-items:start;justify-content:space-between;gap:12px}
.drawer-overline{font:600 10px/1.6 var(--mono);color:var(--blue);letter-spacing:.08em}
.drawer-close{border:1px solid var(--line);background:transparent;width:37px;height:37px;display:grid;place-items:center;font-size:24px;line-height:1;font-weight:300}
.drawer-close:hover{background:white;border-color:var(--blue)}
.drawer-title{font-size:clamp(27px,7vw,34px);font-weight:600;line-height:1.22;letter-spacing:-.065em;margin:35px 0 12px}
.drawer-subtitle{font-size:13px;color:#686868;line-height:1.9;margin:0 0 34px}
.options{display:flex;flex-direction:column;gap:12px}
.mode-option{width:100%;background:#fff;border:1px solid var(--line);padding:21px 17px 21px 20px;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;transition:border-color .17s ease,background .17s ease;position:relative}
.mode-option:hover{border-color:var(--blue)}
.mode-option.selected{background:#f3f6ff;border-color:var(--blue)}
.mode-option.selected:before{content:"";position:absolute;inset:-1px auto -1px -1px;width:3px;background:var(--blue)}
.option-meta{font:500 10px var(--mono);letter-spacing:.045em;color:var(--blue)}
.option-name{display:block;font-size:23px;letter-spacing:-.05em;font-weight:600;margin:12px 0 7px}
.option-desc{font-size:12px;line-height:1.75;color:#666}
.option-arrow{font-size:22px;color:var(--blue);font-weight:300}
.mode-option.selected .option-arrow{font-size:17px}
.drawer-bottom{border-top:1px solid var(--line);margin-top:auto;padding-top:23px;display:flex;flex-direction:column;gap:13px}
.drawer-bottom p{margin:0;font:500 10px/1.8 var(--mono);color:#777}
.open-standalone{align-self:flex-start;text-decoration:none;color:var(--blue);font-size:12px}
.open-standalone:hover{text-decoration:underline}
@media (max-width:650px){.side-tab{width:34px;min-height:86px;top:48%;padding:10px 0}.side-tab .vertical{font-size:10px}.drawer-inner{padding:25px 21px 28px}.drawer-title{margin-top:28px}.mode-option{padding:18px 15px}.option-name{font-size:22px}}
/* Touch devices cannot hover to rediscover a fully invisible switcher.
   Keep only a thin blue handle visible; its transparent 32px hit target
   is generous enough to tap without obstructing slide content. */
@media (hover:none), (max-width:650px){
  .side-tab.is-tucked,.side-tab.is-tucked:hover:not(:focus-visible){
    opacity:1;transform:translate(-4px,-50%);width:36px;min-height:84px;
    background:transparent;border:0;box-shadow:none;border-radius:0;
    padding:0;gap:0;overflow:visible;
  }
  .side-tab.is-tucked::after{
    content:"";position:absolute;left:8px;top:50%;transform:translateY(-50%);
    width:7px;height:56px;background:var(--blue);
    border-radius:0 4px 4px 0;box-shadow:0 1px 6px rgba(0,47,167,.18);
  }
  .side-tab.is-tucked .symbol,.side-tab.is-tucked .vertical,.side-tab.is-tucked .tiny{opacity:0}
  .side-tab.is-tucked:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
}
@media (prefers-reduced-motion:reduce){#switchDrawer[open],#switchDrawer.closing,#switchDrawer::backdrop,#switchDrawer.closing::backdrop{animation:none}.side-tab,.mode-option{transition:none}}
</style>
</head>
<body>
<iframe id="presentation" title="项目介绍｜个人 AI 系统" src="./about/" allow="fullscreen" allowfullscreen></iframe>
<button type="button" class="side-tab is-tucked" id="openSwitch" aria-label="展开版本切换侧栏" aria-haspopup="dialog" aria-controls="switchDrawer" aria-expanded="false" title="切换项目介绍 / 学生版 / 成人版">
  <span class="symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <span class="vertical" aria-hidden="true">切换版本</span>
  <span class="tiny" id="tabNumber" aria-hidden="true">00</span>
</button>
<dialog id="switchDrawer" aria-labelledby="drawerTitle" aria-modal="true">
  <div class="drawer-inner">
    <div class="drawer-header">
      <span class="drawer-overline">PERSONAL AI SYSTEM<br>ONE SYSTEM / TWO PATHS</span>
      <button class="drawer-close" id="closeSwitch" type="button" aria-label="折叠侧栏">×</button>
    </div>
    <h1 class="drawer-title" id="drawerTitle">选择内容。</h1>
    <p class="drawer-subtitle">项目介绍、学生版与成人版。<br>选中后自动收起，不遮挡正文。</p>
    <div class="options" role="group" aria-label="页面选项">
      <button class="mode-option selected" type="button" data-view="about" aria-pressed="true">
        <span><span class="option-meta">00 / PROJECT · OVERVIEW</span><strong class="option-name">项目介绍</strong><span class="option-desc">免费资源 · 学习方法 · 作者与联系方式</span></span>
        <span class="option-arrow" aria-hidden="true">↗</span>
      </button>
      <button class="mode-option" type="button" data-view="study" aria-pressed="false">
        <span><span class="option-meta">01 / STUDY · 10 PAGES</span><strong class="option-name">在学中扩展</strong><span class="option-desc">学生版 · 让每次学习成为下次进步的起点</span></span>
        <span class="option-arrow" aria-hidden="true">✓</span>
      </button>
      <button class="mode-option" type="button" data-view="adult" aria-pressed="false">
        <span><span class="option-meta">02 / WORK · 11 PAGES</span><strong class="option-name">在做中扩展</strong><span class="option-desc">成人版 · 从真实任务到长期经验复用</span></span>
        <span class="option-arrow" aria-hidden="true">↗</span>
      </button>
    </div>
    <div class="drawer-bottom">
      <p>CODEX × OBSIDIAN<br>FROM PRACTICE TO REUSE</p>
      <a class="open-standalone" id="openStandalone" href="./about/" target="_blank" rel="noopener">独立打开当前版本 ↗</a>
    </div>
  </div>
</dialog>
<script>
(function(){
  'use strict';
  var frame=document.getElementById('presentation');
  var drawer=document.getElementById('switchDrawer');
  var opener=document.getElementById('openSwitch');
  var closer=document.getElementById('closeSwitch');
  var tabNumber=document.getElementById('tabNumber');
  var standalone=document.getElementById('openStandalone');
  var options=Array.from(document.querySelectorAll('[data-view]'));
  var current='about';
  var closeTimer=null;
  function hideLauncher(){
    opener.classList.add('is-tucked');
    try{localStorage.setItem('personal-ai-switcher-used','1')}catch(e){}
  }

  var replayAfterSwitch=false;
  var modes={
    about:{url:'./about/',name:'项目介绍｜个人 AI 系统',number:'00'},
    study:{url:'./study/',name:'在学中扩展｜学生版',number:'01'},
    adult:{url:'./adult/',name:'在做中扩展｜成人版',number:'02'}
  };
  function setMode(mode,push){
    if(!modes[mode])mode='about';
    var info=modes[mode];
    current=mode;
    if(push && mode==='study')replayAfterSwitch=true;
    options.forEach(function(button){
      var selected=button.dataset.view===mode;
      button.classList.toggle('selected',selected);
      button.setAttribute('aria-pressed',String(selected));
      button.querySelector('.option-arrow').textContent=selected?'✓':'↗';
    });
    if(frame.getAttribute('src')!==info.url){frame.src=info.url;}
    frame.title=info.name;
    document.title=info.name+'｜Personal AI System';
    opener.title='当前：'+info.name+'；点击切换';
    tabNumber.textContent=info.number;
    standalone.href=info.url;
    try{sessionStorage.setItem('personal-ai-view',mode)}catch(e){}
    if(push){
      hideLauncher();
      var url=new URL(location.href);
      url.searchParams.set('view',mode);
      history.pushState({view:mode},'',url.pathname+url.search+url.hash);
    }
  }
  // Inner presentations live in a same-origin iframe. Keep keyboard focus in
  // that presentation, not on the small outer switcher button.
  function focusPresentation(){
    try {frame.contentWindow.focus();frame.focus({preventScroll:true});}
    catch(e) {try {frame.focus();}catch(_) {}}
  }
  function replayVisibleStudent(){
    if(!replayAfterSwitch || current!=='study' || drawer.open)return;
    try {
      var doc=frame.contentDocument;
      if(!doc || doc.readyState!=='complete')return;
      var replay=doc.getElementById('replay-motion');
      if(replay){replayAfterSwitch=false;replay.click();}
    }catch(e){}
  }
  function enableEdgeSwipe(){
    try{
      var doc=frame.contentDocument;
      if(!doc || doc.__edgeSwipeEnabled)return;
      doc.__edgeSwipeEnabled=true;
      var start=null;
      doc.addEventListener('touchstart',function(e){
        if(drawer.open || !e.touches || e.touches.length!==1)return;
        var t=e.touches[0];
        start=t.clientX<=26?{x:t.clientX,y:t.clientY}:null;
      },{passive:true});
      doc.addEventListener('touchend',function(e){
        if(!start || !e.changedTouches.length)return;
        var t=e.changedTouches[0],dx=t.clientX-start.x,dy=t.clientY-start.y;
        start=null;
        if(dx>75 && Math.abs(dy)<55)openDrawer();
      },{passive:true});
      doc.addEventListener('touchcancel',function(){start=null},{passive:true});
    }catch(e){}
  }
  frame.addEventListener('load',function(){
    enableEdgeSwipe();
    if(!drawer.open){focusPresentation();replayVisibleStudent();}
  });
  function openDrawer(){
    if(closeTimer){clearTimeout(closeTimer);closeTimer=null;drawer.classList.remove('closing');}
    if(!drawer.open){drawer.showModal();}
    opener.setAttribute('aria-expanded','true');
    var selected=drawer.querySelector('.mode-option.selected');
    if(selected)selected.focus();
  }
  function finishClose(){
    drawer.classList.remove('closing');
    if(drawer.open)drawer.close();
    opener.setAttribute('aria-expanded','false');
    focusPresentation();
    replayVisibleStudent();
    closeTimer=null;
  }
  function closeDrawer(){
    if(!drawer.open || closeTimer)return;
    if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){finishClose();return;}
    drawer.classList.add('closing');
    closeTimer=setTimeout(finishClose,190);
  }
  opener.addEventListener('click',openDrawer);
  closer.addEventListener('click',closeDrawer);
  options.forEach(function(button){button.addEventListener('click',function(){setMode(button.dataset.view,true);closeDrawer();});});
  drawer.addEventListener('click',function(e){
    if(e.target===drawer){
      var box=drawer.getBoundingClientRect();
      if(e.clientX<box.left||e.clientX>box.right||e.clientY<box.top||e.clientY>box.bottom)closeDrawer();
    }
  });
  drawer.addEventListener('cancel',function(e){e.preventDefault();closeDrawer();});
  drawer.addEventListener('close',function(){opener.setAttribute('aria-expanded','false');});
  // The outer document can still receive keys after closing a modal or
  // when the user clicks outside the embedded presentation. Forward to
  // the child BODY (not document: student handlers expect target.closest()).
  document.addEventListener('keydown',function(e){
    if(drawer.open || e.defaultPrevented || e.ctrlKey || e.altKey || e.metaKey)return;
    if(e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
    var keys=['ArrowLeft','ArrowRight','PageUp','PageDown','Home','End'];
    if(!keys.includes(e.key))return;
    try{
      var win=frame.contentWindow;
      var doc=win.document;
      if(!doc || !doc.body)return;
      var keyEvent=new win.KeyboardEvent('keydown',{key:e.key,code:e.code || e.key,bubbles:true,cancelable:true});
      doc.body.dispatchEvent(keyEvent);
      e.preventDefault();
    }catch(err){focusPresentation();}
  });
  window.addEventListener('popstate',function(){
    var view=new URLSearchParams(location.search).get('view');
    if(!modes[view])view='about';
    setMode(view,false);
    closeDrawer();
  });
  var fromUrl=new URLSearchParams(location.search).get('view');
  var remembered=null;
  try{remembered=sessionStorage.getItem('personal-ai-view')}catch(e){}
  var wasUsed=false;
  try{wasUsed=localStorage.getItem('personal-ai-switcher-used')==='1'}catch(e){}
  if(!modes[fromUrl] && !modes[remembered] && !wasUsed)opener.classList.remove('is-tucked');
  setMode(modes[fromUrl]?fromUrl:(modes[remembered]?remembered:'about'),false);
})();
</script>
</body>
</html>
